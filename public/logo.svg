<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <dropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background container for maskable standard layout -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer security grid or technical decorative rings -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#glowGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.4" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.2" />

  <!-- The Safety Shield with shadow -->
  <g filter="url(#shadow)">
    <!-- Path of a modern safety shield -->
    <path d="M 256 70 
             C 320 70, 390 60, 410 95
             C 410 220, 370 340, 256 430
             C 142 340, 102 220, 102 95
             C 122 60, 192 70, 256 70 Z" 
          fill="url(#shieldGrad)" 
          stroke="#38bdf8" 
          stroke-width="6" 
          stroke-linejoin="round" />
  </g>

  <!-- Nested Inner Lining of the Shield -->
  <path d="M 256 88 
           C 310 88, 370 78, 388 108
           C 388 215, 352 320, 256 400
           C 160 320, 124 215, 124 108
           C 142 78, 202 88, 256 88 Z" 
        fill="none" 
        stroke="#60a5fa" 
        stroke-width="2" 
        opacity="0.6" />

  <!-- Accent Divider Line for a high-tech modern aesthetic -->
  <path d="M 256 88 L 256 400" stroke="#1d4ed8" stroke-width="4" opacity="0.5" />

  <!-- Safety Orange accent ribbon/stars or symbol at top center -->
  <path d="M 240 100 L 272 100 L 256 120 Z" fill="url(#accentGrad)" />

  <!-- The Success Checkmark (symbolizes compliance, diagnosis accomplished) -->
  <g filter="url(#shadow)">
    <path d="M 180 240 
             L 235 295 
             L 345 175" 
          fill="none" 
          stroke="#4ade80" 
          stroke-width="28" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <path d="M 180 240 
             L 235 295 
             L 345 175" 
          fill="none" 
          stroke="#22c55e" 
          stroke-width="16" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Glowing core spot -->
  <circle cx="210" cy="270" r="12" fill="#86efac" opacity="0.8" />
  
  <!-- Outer decorative corner technical marks (bracket corners) -->
  <path d="M 40 100 L 40 40 L 100 40" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
  <path d="M 412 40 L 472 40 L 472 100" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
  <path d="M 472 412 L 472 472 L 412 472" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
  <path d="M 100 472 L 40 472 L 40 412" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
  
  <!-- "NOM 030" Elegant Monospace Badge Text -->
  <rect x="186" y="325" width="140" height="30" rx="15" fill="#0f172a" stroke="#fb923c" stroke-width="2" />
  <text x="256" y="345" 
        font-family="JetBrains Mono, monospace, system-ui" 
        font-size="14" 
        font-weight="bold" 
        fill="#f97316" 
        text-anchor="middle" 
        letter-spacing="2">NOM-030</text>
</svg>
